name: Bug report
description: Report reproducible behavior that differs from the intended specification
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened, and which specification defines it?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic reproduction.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include logs, screenshots, versions, and environment details without secrets.
  - type: textarea
    id: scope
    attributes:
      label: Fix scope
      description: Note compatibility requirements and changes that are explicitly out of scope.
